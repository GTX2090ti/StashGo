name: Setup HarmonyOS toolchain
description: 下载并配置 HarmonyOS 命令行工具（含 SDK、hvigor、ohpm、node）

inputs:
  tools-version:
    description: Command Line Tools 版本
    required: false
    # 5.1.0.840 自带 HarmonyOS 5.1.0 SDK（apiVersion 18），与
    # ohos/build-profile.json5 的 compatibleSdkVersion "5.1.0(18)" 一致；
    # 该版本已在本地完整构建出 HAP，云端使用同一版本避免 SDK 版本差异。
    default: 5.1.0.840

runs:
  using: composite
  steps:
    - name: Configure npm registry
      # hvigor 依赖 ~/.npmrc 才能拉取插件依赖
      shell: bash
      run: |
        cat > "$HOME/.npmrc" <<'EOF'
        registry=https://repo.huaweicloud.com/repository/npm/
        @ohos:registry=https://repo.harmonyos.com/npm/
        EOF

    - name: Download and extract Command Line Tools
      shell: bash
      run: |
        set -euo pipefail
        TOOLS_DIR="$RUNNER_TEMP/command-line-tools"
        ZIP_PATH="$RUNNER_TEMP/harmonyos-tools.zip"
        VERSION="${{ inputs.tools-version }}"
        MIRROR_DIR="$(echo "$VERSION" | cut -d. -f1-3)"

        if [ ! -d "$TOOLS_DIR/sdk" ]; then
          # 华为云镜像（与本地验证版本一致）优先，libsdl 镜像兜底
          for URL in \
            "https://repo.huaweicloud.com/harmonyos/ohpm/$MIRROR_DIR/commandline-tools-linux-x64-$VERSION.zip" \
            "https://libsdl.org/harmonyos-devtools/commandline-tools-linux-x64-$VERSION.zip"; do
            echo "downloading $URL"
            if curl -fL --retry 3 --retry-delay 5 -o "$ZIP_PATH" "$URL"; then
              break
            fi
            rm -f "$ZIP_PATH"
          done
          test -f "$ZIP_PATH"
          unzip -q "$ZIP_PATH" -d "$RUNNER_TEMP"
          rm -f "$ZIP_PATH"
        fi

        test -d "$TOOLS_DIR/sdk"
        # SDK 版本必须与 compatibleSdkVersion 匹配，否则 ArkTS 按高版本声明编译会报错
        echo "SDK: $(cat "$TOOLS_DIR/sdk/default/sdk-pkg.json" | tr -d '\n' | sed 's/  */ /g')"
        echo "DEVECO_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
        echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> "$GITHUB_ENV"
        echo "HDC_HOME=$TOOLS_DIR/sdk/default/openharmony/toolchains" >> "$GITHUB_ENV"

    - name: Add toolchain to PATH
      shell: bash
      run: |
        set -euo pipefail
        TOOLS_DIR="$RUNNER_TEMP/command-line-tools"
        for dir in bin tool/node/bin tools/node/bin tools/ohpm/bin tools/hvigor/bin \
                   hvigor/bin ohpm/bin \
                   sdk/default/openharmony/toolchains; do
          if [ -d "$TOOLS_DIR/$dir" ]; then
            echo "$TOOLS_DIR/$dir" >> "$GITHUB_PATH"
          fi
        done

    - name: Select JDK 17
      # hvigor / ohpm 需要 JDK 17+，托管 runner 已预装
      shell: bash
      run: |
        set -euo pipefail
        JAVA_DIR="${JAVA_HOME_17_X64:-}"
        if [ -n "$JAVA_DIR" ] && [ -d "$JAVA_DIR" ]; then
          echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"
          echo "$JAVA_DIR/bin" >> "$GITHUB_PATH"
        fi

    - name: Install runtime libraries
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq libgl1

    - name: Show toolchain versions
      shell: bash
      run: |
        set -uo pipefail
        TOOLS_DIR="$RUNNER_TEMP/command-line-tools"
        export PATH="$TOOLS_DIR/bin:$TOOLS_DIR/tool/node/bin:$TOOLS_DIR/tools/node/bin:$PATH"
        node -v || true
        ohpm -v || true
        hvigorw -v || true
        ls "$TOOLS_DIR/sdk"
