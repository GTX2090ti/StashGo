name: Build HAP

on:
  push:
    branches: [ci-hap]
  workflow_dispatch:
    inputs:
      ref:
        description: 要构建的分支或 tag（留空使用当前分支）
        required: false
        type: string
      upload_to_release:
        description: 构建成功后上传到 v<版本> Release（覆盖同名资产）
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      ref:
        description: 要构建的分支或 tag（留空使用当前分支）
        required: false
        type: string
      upload_to_release:
        description: 构建成功后上传到 v<版本> Release（覆盖同名资产）
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-hap:
    # GitHub 托管 runner + 自动下载 HarmonyOS 命令行工具与 Flutter-OH，
    # 不再依赖装有 DevEco Studio 的自托管 runner。
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup HarmonyOS toolchain
        uses: ./.github/actions/setup-harmonyos-toolchain

      - name: Setup Flutter OH
        uses: ./.github/actions/setup-flutter-oh

      - name: Read version from pubspec
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show SDK info
        shell: bash
        run: |
          SDK="$DEVECO_SDK_HOME/default"
          ls "$SDK"
          cat "$SDK/sdk-pkg.json" 2>/dev/null | head -30 || true
          DTS="$SDK/openharmony/ets/api/@ohos.app.ability.autoFillManager.d.ts"
          if [ -f "$DTS" ]; then
            grep -n "ViewData\|AutoFillType\|requestAutoFill" "$DTS" | head -20
          else
            echo "missing $DTS"
            ls "$SDK/openharmony/ets/api" | grep -i autofill || true
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build HAP (unsigned)
        # signingConfigs 为空，必须关闭签名；flutter build hap 会先 flutter assemble
        # 再调用 hvigorw assembleHap，避免 hvigor 增量判定跳过 Dart 编译。
        run: |
          flutter build hap --release --no-codesign \
            --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Collect HAP
        id: hap
        shell: bash
        run: |
          HAP=$(find build/ohos/hap ohos/entry/build -type f -name '*.hap' 2>/dev/null | head -1)
          if [ -z "$HAP" ]; then
            echo "未找到 HAP 产物，请检查构建日志" >&2
            exit 1
          fi
          OUT="StashScrubber-HarmonyOS-v${{ steps.version.outputs.version }}-unsigned.hap"
          cp "$HAP" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: StashScrubber-HarmonyOS-v${{ steps.version.outputs.version }}-unsigned
          path: ${{ steps.hap.outputs.path }}
          if-no-files-found: error

      - name: Upload to GitHub Release
        if: ${{ inputs.upload_to_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v${{ steps.version.outputs.version }}" "${{ steps.hap.outputs.path }}" --clobber
