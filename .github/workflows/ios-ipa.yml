name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Read version from pubspec
        id: version
        run: |
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter -v build ios --release --no-codesign --dart-define=APP_VERSION=${{ steps.version.outputs.version }}

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          APP=$(ls -d *.app | head -1)
          mkdir -p Payload
          cp -R "$APP" "Payload/StashScrubber.app"
          zip -qry "../../../StashScrubber-iOS-v${{ steps.version.outputs.version }}-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: StashScrubber-iOS-v${{ steps.version.outputs.version }}-unsigned
          path: StashScrubber-iOS-v${{ steps.version.outputs.version }}-unsigned.ipa
          if-no-files-found: error
