workflows:
  ios-ipa:
    name: Build unsigned IPA (Flutter)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Get dependencies
        script: |
          set -e
          flutter pub get
      - name: Build iOS (unsigned)
        script: |
          set -e
          VERSION=$(sed -n 's/^version: *\([0-9][0-9.]*\).*/\1/p' pubspec.yaml | head -1)
          echo "App version: $VERSION"
          flutter build ios --release --no-codesign --dart-define=APP_VERSION="$VERSION"
      - name: Package IPA
        script: |
          set -e
          cd build/ios/iphoneos
          APP=$(ls -d *.app | head -1)
          echo "Found app bundle: $APP"
          mkdir -p Payload
          cp -R "$APP" "Payload/StashGo.app"
          zip -r ../../../StashGo-unsigned.ipa Payload
    artifacts:
      - StashGo-unsigned.ipa
