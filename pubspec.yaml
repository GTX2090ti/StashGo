name: stash_scrubber_flutter
description: Stash media server client (Flutter, iOS / HarmonyOS).
publish_to: 'none'
version: 1.7.0+702

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.3.0
  shared_preferences_ohos: ^2.2.0
  local_auth: ^2.3.0
  # ApiKey 走 Keychain 保存（iOS）。OHOS 无该插件实现时由 SecureStore 自动降级。
  flutter_secure_storage: ^10.3.1
  local_auth_ohos:
    git:
      url: https://github.com/GTX2090ti/local_auth_ohos.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
